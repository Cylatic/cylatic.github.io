name: Cylatic Research Quality Pipeline

on:
  workflow_dispatch:
  schedule:
    # Monitoring is limited to once daily. It never publishes research articles.
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: cylatic-research-quality
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  NOTIFICATION_TO: 'jigarlad786@gmail.com'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate maintenance and research scripts
        run: |
          python -m py_compile .github/scripts/generate_blog.py
          python -m py_compile .github/scripts/research_monitor.py
          python -m py_compile .github/scripts/site_migration.py
          python -m py_compile .github/scripts/site_quality_audit.py

      - name: Apply idempotent AdSense quality rebuild
        run: python .github/scripts/site_migration.py

      - name: Collect research leads safely
        run: python .github/scripts/research_monitor.py

      - name: Run site quality audit
        run: python .github/scripts/site_quality_audit.py

      - name: Persist maintenance and internal research queue
        run: |
          git config user.name "cylatic-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/research/latest-candidates.json blog sitemap.xml
          if git diff --cached --quiet; then
            echo "No maintenance or research-queue changes."
            exit 0
          fi
          git commit -m "chore: maintain AdSense-ready content architecture"
          git push origin HEAD:main

      - name: Send failure email
        if: failure()
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_TO: ${{ env.NOTIFICATION_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          username = os.environ.get('SMTP_USERNAME')
          password = os.environ.get('SMTP_PASSWORD')
          recipient = os.environ['NOTIFICATION_TO']
          if not username or not password:
              print('Failure email skipped: Gmail notification secrets are not configured.')
              raise SystemExit(0)
          msg = EmailMessage()
          msg['Subject'] = 'Cylatic ALERT: research quality pipeline failed'
          msg['From'] = username
          msg['To'] = recipient
          msg.set_content(
              'The Cylatic research quality pipeline failed.\n\n'
              f'Repository: {os.environ["REPOSITORY"]}\n'
              f'Branch: {os.environ["BRANCH"]}\n'
              f'Commit: {os.environ["SHA"]}\n'
              f'Run: {os.environ["RUN_URL"]}\n\n'
              'No public research article was automatically published.'
          )
          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as smtp:
              smtp.starttls()
              smtp.login(username, password)
              smtp.send_message(msg)
          PY
