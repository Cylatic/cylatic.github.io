name: Cylatic Hourly Cybersecurity Research

on:
  schedule:
    # Run hourly, but GitHub may delay scheduled jobs during high load.
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cylatic-cybersecurity-research
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Normalize Gemini model configuration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('.github/scripts/generate_blog.py')
          s = p.read_text(encoding='utf-8')

          # Keep the generator on currently supported stable Gemini 3 models.
          s, model_changes = re.subn(
              r'models\s*=\s*\[[^\]]*\]',
              'models = ["gemini-3.6-flash", "gemini-3.5-flash-lite"]',
              s,
              count=1,
          )

          # Gemini 3 documentation deprecates legacy sampling controls such as
          # temperature. Remove it rather than allowing a future API validation
          # failure after the model migration.
          s, temperature_changes = re.subn(
              r'\n\s*"temperature":\s*0\.2,',
              '',
              s,
              count=1,
          )

          p.write_text(s, encoding='utf-8')
          print(f'Model configuration normalized: {model_changes}')
          print(f'Deprecated temperature setting removed: {temperature_changes}')
          PY

      - name: Validate research generator
        run: python3 -m py_compile .github/scripts/generate_blog.py

      - name: Persist Gemini configuration
        run: |
          git config user.name "cylatic-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/scripts/generate_blog.py
          if git diff --cached --quiet; then
            echo "Gemini configuration already current."
            exit 0
          fi
          git commit -m "chore: use supported Gemini 3 models for research"
          git push origin HEAD:main

      - name: Generate research article when a high-value story is found
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/generate_blog.py

      - name: Commit generated research
        run: |
          git config user.name "cylatic-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "No publication this hour."
            exit 0
          fi
          git commit -m "Publish cybersecurity research"
          git push origin HEAD:main
