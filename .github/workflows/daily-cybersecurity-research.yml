name: Daily Cybersecurity Research

on:
  schedule:
    # 12:15 IST every day (06:45 UTC). GitHub may delay scheduled runs slightly.
    - cron: '45 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate and publish technical research
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 .github/scripts/generate_blog.py

      - name: Commit generated research
        run: |
          git config user.name "cylatic-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "No new article generated."
            exit 0
          fi
          git commit -m "Publish daily cybersecurity research"
          git push
