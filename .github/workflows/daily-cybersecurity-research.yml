name: Cylatic Research Quality Pipeline

on:
  workflow_dispatch:
  schedule:
    # Monitoring is intentionally limited to once per day. Publication is NOT automatic.
    - cron: '23 4 * * *'

permissions:
  contents: write

concurrency:
  group: cylatic-research-quality
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONDONTWRITEBYTECODE: '1'
  NOTIFICATION_TO: 'jigarlad786@gmail.com'

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Compile research generator
        run: python -m py_compile .github/scripts/generate_blog.py

      - name: Run site quality audit
        run: python .github/scripts/site_quality_audit.py

      - name: Check generated-output policy
        run: |
          python - <<'PY'
          from pathlib import Path
          blog = Path('blog')
          html_files = list(blog.rglob('*.html')) if blog.exists() else []
          print(f'Indexed blog HTML files currently in repository: {len(html_files)}')
          print('Automatic publication is disabled by design.')
          print('News monitoring must not directly create public pages.')
          PY

      - name: Send failure email
        if: failure()
        continue-on-error: true
        env:
          SMTP_USERNAME: ${{ secrets.GMAIL_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NOTIFICATION_TO: ${{ env.NOTIFICATION_TO }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os, smtplib
          from email.message import EmailMessage
          username = os.environ.get('SMTP_USERNAME')
          password = os.environ.get('SMTP_PASSWORD')
          recipient = os.environ['NOTIFICATION_TO']
          if not username or not password:
              print('Failure email skipped: Gmail notification secrets are not configured.')
              raise SystemExit(0)
          msg = EmailMessage()
          msg['Subject'] = 'Cylatic ALERT: research quality pipeline failed'
          msg['From'] = username
          msg['To'] = recipient
          msg.set_content(
              'The Cylatic research quality pipeline failed.\n\n'
              f'Repository: {os.environ["REPOSITORY"]}\n'
              f'Branch: {os.environ["BRANCH"]}\n'
              f'Commit: {os.environ["SHA"]}\n'
              f'Run: {os.environ["RUN_URL"]}\n\n'
              'No public research article was automatically published.'
          )
          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as smtp:
              smtp.starttls()
              smtp.login(username, password)
              smtp.send_message(msg)
          PY
