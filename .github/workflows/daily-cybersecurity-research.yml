name: Cylatic Hourly Cybersecurity Research

on:
  schedule:
    # Hourly monitoring. GitHub may delay scheduled runs slightly.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cylatic-cybersecurity-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate one research article when a high-value story is found
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 .github/scripts/generate_blog.py

      - name: Commit generated research
        run: |
          git config user.name "cylatic-research-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add blog sitemap.xml
          if git diff --cached --quiet; then
            echo "No publication this hour."
            exit 0
          fi
          git commit -m "Publish cybersecurity research"
          git push
